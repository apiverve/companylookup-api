name: apiverve_companylookup
description: "Company Lookup matches stock tickers, CIK numbers, company names, or SIC codes with official SEC registration records. It returns legal entity names, trading exchanges, tax EINs, Standard Industrial Classification codes, and registered business addresses."
version: 1.2.3
homepage: https://apiverve.com/marketplace/companylookup?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/companylookup-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
