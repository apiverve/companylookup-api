openapi: 3.0.4
info:
  title: Company Lookup
  description: >-
    Company Lookup matches stock tickers, CIK numbers, company names, or SIC
    codes with official SEC registration records. It returns legal entity names,
    trading exchanges, tax EINs, Standard Industrial Classification codes, and
    registered business addresses.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/companylookup:
    get:
      summary: Company Lookup
      description: Get company information by stock ticker symbol.
      operationId: companylookup
      parameters:
        - name: ticker
          in: query
          schema:
            type: string
          required: true
          description: Stock ticker symbol (e.g. AAPL, MSFT, GOOGL)
          example: AAPL
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  count: 1
                  companies:
                    - ticker: AAPL
                      cik: '0000320193'
                      name: Apple Inc.
                      tickers:
                        - AAPL
                      exchanges:
                        - Nasdaq
                      entityType: operating
                      sic: '3571'
                      sicDescription: Electronic Computers
                      sector: Manufacturing
                      category: Large accelerated filer
                      stateOfIncorporation: CA
                      fiscalYearEnd: '0926'
                      ein: '942404110'
                      phone: (408) 996-1010
                      addresses:
                        mailing:
                          street1: ONE APPLE PARK WAY
                          street2: null
                          city: CUPERTINO
                          stateOrCountry: CA
                          zipCode: '95014'
                          stateOrCountryDescription: CA
                          isForeignLocation: 0
                          foreignStateTerritory: null
                          country: null
                          countryCode: null
                        business:
                          street1: ONE APPLE PARK WAY
                          street2: null
                          city: CUPERTINO
                          stateOrCountry: CA
                          zipCode: '95014'
                          stateOrCountryDescription: CA
                          isForeignLocation: null
                          foreignStateTerritory: null
                          country: null
                          countryCode: null
                      formerNames:
                        - name: APPLE INC
                          from: '2007-01-10T05:00:00.000Z'
                          to: '2019-08-05T04:00:00.000Z'
                        - name: APPLE COMPUTER INC
                          from: '1994-01-26T05:00:00.000Z'
                          to: '2007-01-04T05:00:00.000Z'
                        - name: APPLE COMPUTER INC/ FA
                          from: '1997-07-28T04:00:00.000Z'
                          to: '1997-07-28T04:00:00.000Z'
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
